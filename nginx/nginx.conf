user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  keepalive_timeout  65;
  gzip on;

  # Bloco para cars.gndev.online
  server {
    listen 80;
    server_name cars.gndev.online;

    location /static/ {
      alias /app/staticfiles/;
      expires 1d;
      add_header Cache-Control "public";
    }

    location /media/ {
      alias /app/media/;
      expires off;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_pass http://web:8000;
    }
  }

  # Exemplo: adicionar outro projeto (projeto2.gndev.online)
  # Basta criar um novo bloco server como abaixo e garantir que o serviço web do projeto2
  # esteja rodando em outro container (ex: web_projeto2:8001) e com volumes próprios.
